<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Wild Loop | Trips across Indonesia</title>
  <meta name="description" content="Trips across the islands of Indonesia with local guides. Markets, fishing villages, volcanoes and the people who live there. Based in Lombok.">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#17332a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Wild Loop">
  <meta property="og:description" content="Trips across the islands of Indonesia with local guides.">
  <!-- Update these URLs if the site moves to its own domain. -->
  <meta property="og:url" content="https://thewildloop.github.io/Travel/">
  <meta property="og:image" content="https://thewildloop.github.io/Travel/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav>
      <a href="#where">Loops</a>
      <a href="#guides-sec">Guides</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <!-- Optional: drop a short muted clip at img/hero.mp4 (under 5 MB). Missing file is fine. -->
      <video class="bg" autoplay muted loop playsinline preload="none" aria-hidden="true"><source src="img/hero.mp4" type="video/mp4"></video>
      <div class="hero-in">
        <h1 class="word" aria-label="The Wild Loop">
          <span class="the" aria-hidden="true">The</span>
          <span class="wild" aria-hidden="true">Wild</span>
          <span class="loop" aria-hidden="true">LOOP</span>
        </h1>
        <p class="lead">Trips across the islands of Indonesia, with locals. Markets, fishing villages, volcanoes and the people who live there.</p>
        <p><a class="btn" href="#where">See the loops</a></p>
        <p class="traced" id="traced"></p>
      </div>
    </section>

    <section class="sec" id="where">
      <h2>Pick a loop</h2>
      <div id="map" role="region" aria-label="Map of the islands we visit"></div>
      <div class="pick" id="pick"></div>
      <div class="chips" id="chips"></div>
      <div id="loops"></div>
    </section>

    <section class="sec light" id="guides-sec">
      <h2>Your guides</h2>
      <div class="guides" id="guides"></div>
    </section>

    <section class="sec dark" id="contact">
      <h2>Tell us where you want to go</h2>
      <p class="lead">Based in Lombok, Indonesia.</p>
      <p class="links" id="contact-links"></p>
    </section>
  </main>

  <a class="btn wa" hidden target="_blank" rel="noopener">WhatsApp</a>

  <dialog id="trip" aria-label="Loop details"><div class="dlg-body" id="trip-body"></div></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="loops.js"></script>
  <script src="app.js"></script>
</body>
</html>
